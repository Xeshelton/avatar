<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVADIA Testzugang · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8F1F5; --surface:#FFFFFF; --ink:#22302D; --ink-soft:#3E4E4A; --ink-faint:#5F716B;
    --petrol:#1F5B62; --petrol-deep:#153F44; --sage:#6E9179; --sage-light:#A8C7B3; --line:#D7E4EA;
    --amber:#B0703E; --amber-soft:#F1E1D2; --radius:14px;
    --shadow:0 1px 2px rgba(21,63,68,0.05), 0 10px 28px rgba(21,63,68,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
    border-top:3px solid var(--petrol);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:36px 32px;text-align:center;
  }
  .orb{
    width:44px;height:44px;border-radius:50%;margin:0 auto 18px;
    background:radial-gradient(circle at 32% 28%, var(--sage-light) 0%, var(--sage) 34%, var(--petrol) 68%, var(--petrol-deep) 100%);
  }
  h1{font-family:'Newsreader',serif;font-weight:500;font-size:22px;margin:0 0 6px;color:var(--petrol-deep);}
  p.sub{font-size:13.5px;color:var(--ink-faint);margin:0 0 24px;}
  input[type="password"]{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:12px 14px;
    border:1px solid var(--line);border-radius:10px;margin-bottom:14px;color:var(--ink);
  }
  input[type="password"]:focus{outline:2px solid var(--petrol);outline-offset:1px;}
  button{
    width:100%;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;color:#fff;
    background:var(--petrol);border:none;border-radius:999px;padding:13px;cursor:pointer;
  }
  button:hover{background:var(--petrol-deep);}
  .error{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--amber-soft);color:var(--amber);
    border-radius:8px;padding:8px 10px;margin-bottom:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="orb"></div>
    <h1>AVADIA Testzugang</h1>
    <p class="sub">Bitte gib den Zugangscode ein, den du von uns erhalten hast.</p>
    <form method="POST" action="/login" id="loginForm">
      <div class="error" id="errorMsg" style="display:none;">Falscher Zugangscode, bitte nochmal versuchen.</div>
      <input type="password" name="password" placeholder="Zugangscode" required autofocus>
      <button type="submit">Weiter</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>
</body>
</html>
